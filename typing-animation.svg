<svg width="800" height="90" viewBox="0 0 800 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <style>
    .banner-text {
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      font-size: 21px;
      font-weight: 600;
    }
    .cursor {
      fill: #A78BFA;
    }
  </style>

  <!-- Dark Rounded Terminal Container -->
  <rect width="800" height="90" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Slide 1: Identity -->
  <g>
    <text x="45" y="52" class="banner-text" fill="url(#purpleGrad)">
      👋 Hi, I'm Dani Sam — <tspan fill="#38BDF8">@voidhyr</tspan>
    </text>
    <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.03;0.22;0.25;0.5;0.75;0.97;0.99;1" dur="20s" repeatCount="indefinite" />
  </g>

  <!-- Slide 2: Role -->
  <g>
    <text x="45" y="52" class="banner-text" fill="#F1F5F9">
      <tspan fill="#34D399">&gt;</tspan> Aspiring Software Engineer
    </text>
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.25;0.28;0.47;0.50;0.75;0.97;0.99;1" dur="20s" repeatCount="indefinite" />
  </g>

  <!-- Slide 3: Core Stack -->
  <g>
    <text x="45" y="52" class="banner-text" fill="#F1F5F9">
      <tspan fill="#F59E0B">⚡</tspan> Python • SQL • Linux
    </text>
    <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.50;0.53;0.72;0.75;0.97;0.99;1" dur="20s" repeatCount="indefinite" />
  </g>

  <!-- Slide 4: Tagline -->
  <g>
    <text x="45" y="52" class="banner-text" fill="#A78BFA">
      Exploring the Void — <tspan fill="#94A3B8">From Curiosity to Creation</tspan>
    </text>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.25;0.50;0.75;0.78;0.95;0.97;0.99;1" dur="20s" repeatCount="indefinite" />
  </g>

  <!-- Blinking Cursor -->
  <rect x="735" y="34" width="10" height="22" class="cursor" rx="2">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="0.8s" repeatCount="indefinite" />
  </rect>
</svg>
